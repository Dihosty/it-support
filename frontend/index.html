<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Класифікація звернень служби підтримки</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Класифікатор звернень</h1>
        <p>
          Автоматичне визначення типу звернення: Технічне, Фінансове,
          Інформаційне, Безпека
        </p>
      </div>

      <div class="card">
        <h2>Навчання моделі</h2>
        <button type="button" class="btn" onclick="trainModel()" id="trainBtn">
          Навчити модель
        </button>
        <div id="trainResult"></div>
        <div id="stats" class="stats"></div>
      </div>

      <div class="card">
        <h2>Класифікація звернення</h2>
        <div class="input-group">
          <label for="ticketText">Введіть звернення (мінімум 2 символи):</label>
          <textarea
            id="ticketText"
            placeholder="'мій інтернет не працює' або 'my account was hacked'"
          ></textarea>
        </div>
        <button
          type="button"
          class="btn"
          onclick="classifyTicket()"
          id="classifyBtn"
        >
          Класифікувати
        </button>
        <div id="classifyResult"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
